name: CI

# NOTE: GitHub ne lit les workflows qu'à la RACINE d'un dépôt. Tant que
# finary-mcp vit dans un sous-dossier, ce fichier est inerte : il s'activera
# le jour où le dossier deviendra son propre dépôt (voir README).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Verify the server starts and exposes only read-only tools
        run: |
          python - <<'PY'
          import asyncio
          from finary_mcp.server import mcp

          tools = asyncio.run(mcp.list_tools())
          assert tools, "no tools registered"
          for tool in tools:
              assert tool.annotations and tool.annotations.read_only_hint, tool.name
          print(f"{len(tools)} read-only tools OK")
          PY
